<!DOCTYPE html>
<html lang="en">
<head>
  <title>Emily cards :-)</title>

  <style>
  * {
    box-sizing: border-box;

    height: 100%;

  body {

      border: 1px solid red;

<body>
  <!--

  <script>

/*

function setup() {
  createCanvas(innerWidth, innerHeight);
  noLoop();
}

function draw() {
  push();
  translate(width / 2, height / 2);
  noFill();
  stroke(0);
  scale(1.5);
  strokeWeight(1);
  P5.hershey.putText("Happy 8th Anniversary, Emily!",{
    cmap:  FONT_HERSHEY.TRIPLEX,
    align: "center",
    //noise: 0,
  });
  pop();
}

  </script>
</body>
