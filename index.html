const canvas = document.querySelector("canvas");
canvas.width = innerWidth;
canvas.height = innerHeight;
const ctx = canvas.getContext("2d");

ctx.fillStyle = "#222";
ctx.fillRect(0, 0, canvas.width, canvas.height);
const rand = n => ~~(Math.random() * n);
const chunkSize = 133;

ctx.fillStyle = "#000";
ctx.strokeStyle = "#444";
//ctx.strokeStyle = "#000";
//for (let i = -chunkSize / 2; i < canvas.height + chunkSize; i += chunkSize / 4) {
//  ctx.beginPath();
//  ctx.moveTo(0, i);
//  ctx.lineTo(canvas.width, i);
//  ctx.stroke();
//}
ctx.fillStyle = "#000";
ctx.strokeStyle = "#fff";
//ctx.strokeStyle = "#000";
ctx.lineWidth = 1;

for (let i = -chunkSize; i < canvas.height + chunkSize; i += chunkSize) {
  ctx.beginPath();
  ctx.moveTo(-chunkSize, i);

  for (let j = -chunkSize, k = 0; j < canvas.width + chunkSize; j += chunkSize, k += chunkSize / 11) {
    ctx.lineTo(j, i + k);
    ctx.lineTo(j - 0, i + k + 50);
  }

  const v = [];
  for (let j = -chunkSize + 30, k = 0; j < canvas.width + chunkSize; j += chunkSize, k += chunkSize / 11) {
    v.push([j, i + 100 + k]);
    v.push([j + 10, i + 100 + k + 50]);
  }
  for (const [x, y] of v.reverse()) {
    ctx.lineTo(x, y);
  }

  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

const messages = [
  "BRs",
  "Claude",
  "Woobie Cats",
  "Caterpillar Rubs",
  "B.O.",
  "Pizza Box",
  "Snuggles",
  "Walks",
  "Bike Repairs",
  "Happy 7th Anniversary, Emily!",
  "Love, Greg",
  "Owls",
  "Kale",
  "Oatmeal",
  "Capybaras",
  "Elephants",
  "Greenland Sharks",
  "No Sugar Added",
  "Wilbur",
  "Fonts",
  "Popcorn",
  "Whispers",
];
const mainEl = document.querySelector("#main");

ctx.strokeStyle = "#fff";
ctx.fillStyle = "#fff";
ctx.rotate(-10 * Math.PI / 180);
ctx.translate(-chunkSize * 2, -150);
for (let i = -chunkSize * 2; i < canvas.width + chunkSize; i+= chunkSize) {
  ctx.save();
  messages.forEach((e,i) => {
    ctx.font = '30px monospace';
    //ctx.fillText(e, 15, i * 40 + 230);
    ctx.strokeText(e, 15, i * 40 + 230);
    ctx.translate(30, 0);
  });
}
