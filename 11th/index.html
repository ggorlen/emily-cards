function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "Anonymous"; // Enable cross-origin for external images
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function processImage() {
  const img = await loadImage(imageUrl);
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // Set canvas size to match the image
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);

  // Get image pixel data
  const imageData = ctx.getImageData(0, 0, img.width, img.height);
  const pixels = imageData.data;

  const a = [];
  for (let y = 0; y < img.height; y += checkboxSize) {
    a.push([]);
    for (let x = 0; x < img.width; x += checkboxSize) {
      const index = (y * img.width + x) * 4;
      const r = pixels[index];
      const g = pixels[index + 1];
      const b = pixels[index + 2];

      // Calculate brightness (grayscale approximation)
      const brightness = (r + g + b) / 3;

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.style.top = y + "px";
      cb.style.left = x + "px";
      cb.checked = brightness < threshold;
      a.at(-1).push(brightness < threshold ? 0 : 1);

    }
