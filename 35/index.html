<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emily is 35!</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      div {
        font-size: 18pt;
        font-family: "comic sans ms", cursive;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <script>
      var stuff = [
        "BRs (of course)",
        "Getting squirted in the eye by grapefruit juice",
        "Warm snuggles 💏",
        "Commuting together",
        "Complaining about reality together",
        "Minestrone soup",
        "Going to the farmer's market",
        "Watching Magnolia together",
        "Bouldering injuries",
        "Frank and Phil ripping socks off",
        "Visiting your family in Sacramento",
        "Playing SET",
        "Leif",
        "Moving with the carts from your job",
        "Buying iPhones",
        "Going to see Mulholland Drive",
        "David Lynch",
        "Comulate holiday party",
        "Eating tasty food you made",
        "Singing annoying Emily songs!",
        "Claude asking questions 🦀 ❔",
        "Visiting Santa Cruz and hiking the trails together",
        "Reading Thomas Bernhard books together",
        "Kangarooing when you get home",
        "Forehead on cheek",
        "Cattywumpus woobies",
        "Furry mountain goats",
        "Walking to Ft Winfield Scott",
        "Kale Pie!",
        "Pancakes",
        "Toe kisses",
        "Exchanging emails when we're at work",
        "Underwater sea cables",
        "Caterpillaring together",
        "Running into each other on the bus",
        "Running into each other at the goats",
        "Listening to mourning doves together",
        "Visiting Mr. Floofkins and Coco",
        "Making drool art",
        "Hippo flossing time",
        
      ];
      
      // do put colored circles behind each letter
      var items = [];

      var dist = (x, y, xx, yy) => ((yy - y) ** 2 + (xx - x) ** 2) ** 0.5;
      var sample = () => stuff[~~(Math.random() * stuff.length)];

      var current = [...sample() + " "];
      var lastPos = { x: 0, y: 0 };
      
      // moving up should put letters in opposite order as well

      document.addEventListener("mousemove", (event) => {
        var [x, y] = [event.offsetX, event.offsetY];
        console.log(dist(x, y, lastPos.x, lastPos.y))

        if (dist(x, y, lastPos.x, lastPos.y) > 30) {
          var letter = x > lastPos.x ? current.shift() : current.pop();

          if (!letter) {
            current = [...sample() + " "];
            letter = x > lastPos.x ? current.shift() : current.pop();
          }

          const div = document.createElement("div");
          div.style.top = y + "px";
          div.style.left = x + "px";
          div.textContent = letter;
          document.body.appendChild(div);
          lastPos.x = x;
          lastPos.y = y;
        }
        else {
          console.log("HI")
        }
      });
    </script>
  </body>
</html>
