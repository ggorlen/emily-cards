<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emily is 35!</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      div {
        font-size: 18pt;
        font-family: monospace;
        position: absolute;
        border-radius: 50%;
        width: 35px;
        height: 35px;
        display: flex;
        justify-content: center;
        align-items: center;   
      }
    </style>
  </head>
  <body>
    <script>
      var stuff = [
        "BRs (of course)",
        "Getting squirted in the eye by grapefruit juice",
        "Warm snuggles 💏",
        "Commuting",
        "Complaining about reality",
        "Minestrone soup",
        "Going to the farmer's market",
        "Watching Magnolia",
        "Bouldering injuries",
        "Frank and Phil ripping socks off",
        "Visiting your family in Sacramento",
        "Playing SET",
        "Leif",
        "Moving with the carts from your job",
        "Buying iPhones",
        "Going to see Mulholland Drive",
        "David Lynch",
        "Comulate holiday party",
        "Eating tasty food you made",
        "Singing annoying Emily songs!",
        "Claude asking questions 🦀 ❔",
        "Visiting Santa Cruz and hiking the trails",
        "Reading Thomas Bernhard books",
        "Kangarooing when you get home",
        "Forehead on cheek",
        "Cattywumpus woobies",
        "Furry mountain goats",
        "Walking to Ft Winfield Scott",
        "Kale Pie!",
        "Pancakes",
        "Toe kisses",
        "Exchanging emails when we're at work",
        "Underwater sea cables",
        "Caterpillaring",
        "Running into each other on the bus",
        "Running into each other at the goats",
        "Listening to mourning doves",
        "Visiting Mr. Floofkins and Coco",
        "Making drool art",
        "Hippo flossing time",
        "Stretching",
        "Doing the laundry",
        "Visting the library",
        "Mushroom risotto",
        "Tasty Emily curries!",
      ];
      
      var items = [];

      var dist = (x, y, xx, yy) => ((yy - y) ** 2 + (xx - x) ** 2) ** 0.5;
      var sample = () => stuff[~~(Math.random() * stuff.length)];
      var rand = (n) => ~~(Math.random() * n);

      var current = [...sample() + "  "];
      var historyx = [];
      var currentColor = `hsl(${rand(360)}, ${rand(100)}%, 50%)`;
      var lastPos = { x: 0, y: 0 };
      
      // moving up and to the right should put letters in opposite order as well

      document.addEventListener("mousemove", (event) => {
        var [x, y] = [event.pageX, event.pageY];

        if (dist(x, y, lastPos.x, lastPos.y) > 25) {
          var letter = x > lastPos.x ? current.shift() : current.pop();

          if (!letter) {
            current = [...sample() + "  "];
            currentColor = `hsl(${rand(360)}, ${rand(100)}%, 40%)`;
            letter = x > lastPos.x ? current.shift() : current.pop();
          }

          const div = document.createElement("div");
          div.style.top = y + "px";
          div.style.left = x + "px";
          div.style.background = letter !== " " ? currentColor : "";
          div.textContent = letter === "_" ? " " : letter;
          document.body.appendChild(div);
          lastPos.x = x;
          lastPos.y = y;
          historyx.push(div);
          if (historyx.length > 100) {
            historyx.shift().remove();
          }
        }
      });
    </script>
  </body>
</html>
