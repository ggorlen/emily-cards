      "Emily has many cool hobbies. Mostly cooking but also photography, writing, reading, and appreciating DIY stuff.",

    const wallpapers = [
'https://upload.wikimedia.org/wikipedia/commons/e/e1/Cattle_tyrant_%28Machetornis_rixosa%29_on_Capybara.jpg',
'https://upload.wikimedia.org/wikipedia/commons/3/34/Hydrochoeris_hydrochaeris_in_Brazil_in_Petr%C3%B3polis%2C_Rio_de_Janeiro%2C_Brazil_09.jpg',
'https://upload.wikimedia.org/wikipedia/commons/9/96/Capybara_Eating_Hay_11_11_2018.jpg',
'https://upload.wikimedia.org/wikipedia/commons/9/99/Capivara%28Hydrochoerus_hydrochaeris%29.jpg',
'https://upload.wikimedia.org/wikipedia/commons/6/65/Vervet_monkey_with_young.jpg',
    ];

    let clickCount = 0;
    let wallpaperIndex = ~~(Math.random() * wallpapers.length);
    let dialogCount = 0;

    function setWallpaper() {
      document.body.style.backgroundImage =
        `url("${wallpapers[wallpaperIndex]}")`;
    }
    setWallpaper();

    function randomFrom(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function randomPosition(el) {
      const padding = 20;
      const x = Math.random() * (window.innerWidth - el.offsetWidth - padding);
      const y = Math.random() * (window.innerHeight - el.offsetHeight - padding);
      el.style.left = `${Math.max(0, x)}px`;
      el.style.top = `${Math.max(0, y)}px`;
    }

    function spawnDialog(i) {
      if (dialogCount >= MAX_DIALOGS) return;

      const dialog = document.createElement("div");
      dialog.className = "window";
      dialog.style.position = "absolute";
      dialog.style.width = "260px";

      const types = [
        "Cuddly", "Deluxe", "Windows", "Fabuously", "Fantastical",
        "Mindblowing", "Stupendous", "Loving", "Lovable", "Squeezable",
        "Warm", "Soft", "Friend", "My Pal", "Serious Roommate",
        "Great buddy", "Bubby for life", "The Excellent", "Grumpy Monster",
        "Beautiful", "Marvelous", 
      ];

      const confirms = ["OK", "OK", "OK", "You bet!", "Right-o", "Sure", "Yes!", "Okay", "We're aligned", "kk", "Got it", "Je suis d’accord", "yeppo", "OK", "ok", "Boom!", "Bam!", "Dismiss", "Close dialog"];
      const conf = confirms[~~(Math.random() * confirms.length)];

      const t = Math.random() > 0.8 ? (types[~~(Math.random() * types.length)] + " ") : "";

      dialog.innerHTML = `
        <div class="title-bar">
          <div class="title-bar-text">${t}Emily Alert</div>
        </div>
        <div class="window-body">
          <p>${messages[i] || randomFrom(messages)}</p>
          <div class="field-row" style="justify-content: flex-end">
            <button>${conf}</button>
          </div>
        </div>
      `;

      document.body.appendChild(dialog);
      randomPosition(dialog);
      dialogCount++;

      dialog.querySelector("button").addEventListener("click", () => {
        dialog.remove();
        dialogCount--;
        handleClick();
      });
    }

    function handleClick() {
      clickCount++;
    
      const available = MAX_DIALOGS - dialogCount;
    
      // spawn 0–3 by default
      let toSpawn = Math.floor(Math.random() * 4);
    
      // if we just closed the last dialog, force at least 1
      if (dialogCount === 0) {
        toSpawn = Math.max(toSpawn, 1);
      }
    
      // never exceed the max
      toSpawn = Math.min(toSpawn, available);
    
      for (let i = 0; i < toSpawn; i++) {
        spawnDialog();
      }
    }

    // init
    setWallpaper();
    spawnDialog(0);
  </script>
</body>
</html>
