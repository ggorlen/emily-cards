<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great job Emily!</title>
<script src="https://unpkg.com/roughjs@4.5.2/bundled/rough.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@300&display=swap');
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Source Serif 4', sans-serif;
}
body {
  margin: 0;
/*  background: black;*/
  font-family: monospace;
  font-size: 16pt;
}
    
</style>
</head>
<body>
  <h1>
    Great job, Emily!
  </h1>
  <canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas')
canvas.width = 400;
canvas.height = 200;

const context = canvas.getContext('2d');
context.font = 'bold 20px monospace';
context.fillText('random rects:', 10, 13);
context.fillText('determined rects:', 10, 90);

const rc = rough.canvas(canvas);


rc.rectangle(10, 100, 50, 50, { seed: 3, roughness: 2.8 })
rc.rectangle(80, 100, 50, 50, { seed: 3, roughness: 2.8 })
rc.rectangle(150, 100, 50, 50, { seed: 3, roughness: 2.8 })
</script>
</body>
</html>
